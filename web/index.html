<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="pospro - Solusi Kasir Modern">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pospro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pospro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; }
    #app-loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f8fc; }
    .loading-logo { position: relative; width: 260px; max-width: 80vw; height: 79px; overflow: hidden; }
    .loading-logo img { position: absolute; width: 200%; height: auto; left: 0; top: 50%; transform: translateY(-50%); }
    @media (prefers-color-scheme: dark) {
      #app-loading { background: #141619; }
      .loading-logo img { left: auto; right: 0; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Memuat pospro">
    <div class="loading-logo"><img src="assets/assets/images/logo.png" alt="pospro"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
